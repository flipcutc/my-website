<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Cyan -> Royal Blue -> Vivid Violet -->
    <linearGradient id="fcBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="fcTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <filter id="fcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (FC Italicized Dynamic Slash Emblem) -->
  <g transform="translate(10, 8)">
    <!-- Ambient Glow Backing -->
    <path d="M 28 6 L 56 6 C 62 6 66 10 64 16 L 58 32 C 57 36 53 39 48 39 L 34 39 L 26 62 C 25 65 22 67 18 67 L 6 67 C 2 67 0 64 2 60 L 22 10 C 23 7 25 6 28 6 Z" fill="url(#fcBrandGrad)" opacity="0.25" filter="url(#fcGlow)" />
    
    <!-- Letter F - Modern Swept Blade -->
    <path d="M 28 6 L 58 6 C 63 6 66 9 65 14 L 62 21 C 61 24 58 26 54 26 L 37 26 L 33 36 L 49 36 C 53 36 55 38 54 42 L 52 47 C 51 50 48 52 44 52 L 27 52 L 21 68 C 20 71 17 73 13 73 L 4 73 C 0.5 73 -1 70 0.8 66 L 22 10 C 23 7 25 6 28 6 Z" fill="url(#fcBrandGrad)" />
    
    <!-- Dynamic Slice Accent / Cut Line -->
    <polygon points="40,2 47,2 31,58 24,58" fill="#FFFFFF" opacity="0.9" />

    <!-- Letter C - Dynamic Interlocking Swoosh -->
    <path d="M 64 26 C 68 26 71 29 70 33 L 68 39 C 64 36 59 34 53 34 C 44 34 39 41 36 51 C 33 60 38 67 47 67 C 53 67 59 64 63 60 L 61 66 C 56 71 48 74 40 74 C 27 74 19 64 23 50 C 27 34 39 26 53 26 C 57 26 61 26 64 26 Z" fill="url(#fcBrandGrad)" />
    
    <!-- Speed Dots / Motion Accents -->
    <circle cx="70" cy="18" r="3" fill="#00D2FF" />
    <circle cx="78" cy="28" r="2.2" fill="#7C3AED" />
  </g>

  <!-- Typography: FlipCut Creation -->
  <g transform="translate(95, 20)">
    <!-- FlipCut -->
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="url(#fcTextGrad)">FlipCut</text>
    
    <!-- Creation -->
    <text x="1" y="46" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600" letter-spacing="3" fill="#475569" text-transform="uppercase">CREATION</text>
  </g>
</svg>
